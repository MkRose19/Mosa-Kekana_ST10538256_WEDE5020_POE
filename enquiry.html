<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Involved | Tebogo Theron Foundation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tebogo Theron Foundation</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Programs</a>
            <a href="enquiry.html">Get Involved</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
        <h2>Get Involved</h2>
        <p>Join us as a volunteer, donor, or sponsor. Fill in the form below.</p>
        <img src="images\photo-1552664730-d307ca884978.jpg" width="350">
        <form class="form">
            <label>Full Name</label>
            <input type="text" required>

            <label>Email</label>
            <input type="email" required>

            <label>Phone</label>
            <input type="tel">

            <label>I would like to:</label>
            <select>
                <option>Volunteer</option>
                <option>Become a Monthly Donor</option>
                <option>Sponsor a Program</option>
                <option>General Enquiry</option>
            </select>

            <label>Message</label>
            <textarea rows="5"></textarea>

            <button type="submit" class="btn">Submit Enquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Tebogo Theron Foundation</p>
    </footer>
</body>
</html>
